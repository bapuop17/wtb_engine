name: WTB Studio V99 (Serper Google Images + AI Vision Match + Face-Focus Zoom + Kokoro-82M) - Global News & Documentary Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (publish = build & upload to YouTube; preview = build only; demo = fast 30s graphics test)'
        type: choice
        options: [publish, preview, demo]
        default: publish
      style:
        description: 'Broadcast format (auto selects BBC, Think School, Nitish Rajput, or Abhi & Niyu per story)'
        type: choice
        options: [auto, bbc_dispatch, think_school, nitish_rajput, abhi_niyu]
        default: auto
      renderer:
        description: 'Video renderer engine (python_v98 = OpenCV Cinema FX + 208-Country Atlas; remotion_react = React/Remotion studio)'
        type: choice
        options: [python_v98, remotion_react]
        default: python_v98
      topic:
        description: 'Optional custom topic; leave blank for automatic global news discovery'
        type: string
        default: ''
  schedule:
    - cron: '0 6,18 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: wtb-production-group
  cancel-in-progress: false

jobs:
  documentary:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20 (for optional Remotion React Studio)
        if: ${{ inputs.renderer == 'remotion_react' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unpack V98 Studio Modules from wtb_engine.py
        run: |
          python3 wtb_engine.py --bootstrap

      - name: Cache Kokoro-82M Open-Source Human Voice Weights
        uses: actions/cache@v4
        with:
          path: cache/kokoro
          key: kokoro-82m-v1.0-onnx

      - name: Install Renderer, Fonts, OpenCV Cinema FX & Kokoro-82M Human Voice
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-inter libcairo2-dev pkg-config espeak-ng libsndfile1 || true
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -U yt-dlp
          python3 -m pip install kokoro-onnx || true
          mkdir -p cache/kokoro
          if [ ! -f cache/kokoro/kokoro-v1.0.onnx ]; then
            curl -L --fail --retry 3 -o cache/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx || true
          fi
          if [ ! -f cache/kokoro/voices-v1.0.bin ]; then
            curl -L --fail --retry 3 -o cache/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin || true
          fi

      - name: Install Remotion React Studio Dependencies (when remotion_react selected)
        if: ${{ inputs.renderer == 'remotion_react' }}
        working-directory: remotion_studio
        run: |
          npm install --no-audit --no-fund

      - name: Run Offline Regression & Render Checks (37 Tests)
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s tests -p integration_render.py -v

      - name: Build & Publish V98 Documentary (1080p Long + Vertical Short)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          YOUTUBE_TOKEN_JSON_B64_2: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_2 }}
          YOUTUBE_TOKEN_JSON_B64_3: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_3 }}
          YOUTUBE_TOKEN_JSON_B64_4: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_4 }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          WTB_LLM_PROVIDER: ${{ vars.WTB_LLM_PROVIDER }}
          WTB_LLM_MODEL: ${{ vars.WTB_LLM_MODEL }}
          WTB_VOICE_PROVIDER: ${{ vars.WTB_VOICE_PROVIDER }}
          WTB_VOICE: ${{ vars.WTB_VOICE }}
          WTB_KOKORO_VOICE: ${{ vars.WTB_KOKORO_VOICE }}
          WTB_RENDERER: ${{ inputs.renderer }}
          WTB_PRIVACY: ${{ vars.WTB_PRIVACY }}
          WTB_TOPIC: ${{ inputs.topic }}
          WTB_STYLE: ${{ inputs.style }}
          REQUEST_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$REQUEST_MODE" = "demo" ]; then
            python3 wtb_engine.py --demo
          elif [ "$EVENT_NAME" = "schedule" ] || [ "${REQUEST_MODE:-publish}" = "publish" ]; then
            python3 wtb_engine.py --publish --style "${WTB_STYLE:-auto}"
          else
            python3 wtb_engine.py --style "${WTB_STYLE:-auto}"
          fi

      - name: Save Upload History & SEO Credits Portal to GitHub
        id: sync
        if: always()
        shell: bash
        run: |
          git config user.name 'WorldTalkBrief-Bot'
          git config user.email 'bot@users.noreply.github.com'
          test ! -f studio_history.json || git add studio_history.json
          test ! -f published_history.json || git add published_history.json
          test ! -d docs/articles || git add docs/articles/
          if ! git diff --cached --quiet; then
            git commit -m 'Save WTB Studio V98 (Kokoro-82M + Remotion + OpenCV Cinema FX) receipts and credits [skip ci]' || true
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME" || true
          fi

      - name: Upload Lightweight Error & QC Diagnostics Only (No Heavy MP4s)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WTB-Logs-V99-${{ github.run_number }}
          path: |
            output/**/quality_report.json
            output/**/short_quality_report.json
            output/**/run_report.json
            output/**/research.json
            output/**/storyboard.json
            output/**/*.log
            output/**/*.txt
            output/**/*.srt
            studio_history.json
          if-no-files-found: warn
          retention-days: 7

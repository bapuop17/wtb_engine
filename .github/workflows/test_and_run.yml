name: WTB News Engine V21 (God-Level Documentary Production)

on:
  schedule:
    # Run every 30 minutes automatically (24x7 Global News Coverage)
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: wtb-v21-production-group
  cancel-in-progress: false

env:
  # Silence Node.js 20 deprecation warnings on GitHub Actions runners
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Multimedia, Cairo & Font Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ffmpeg \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            fonts-dejavu-core \
            fonts-liberation \
             fonts-freefont-ttf

      - name: Install Python V21 Documentary & Motion-Graphics Libraries
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            feedparser \
            beautifulsoup4 \
            lxml \
            edge-tts \
            pillow \
            numpy \
            scipy \
            matplotlib \
            pycairo \
            opencv-python-headless \
            ddgs \
            yt-dlp \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2 \
            pytrends \
            curl_cffi

      - name: Run WTB V21 Documentary News Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python wtb_engine.py

      - name: Upload Generated Video & Audit Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wtb-v21-video-output-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
            *.mp4
          if-no-files-found: ignore
          retention-days: 7

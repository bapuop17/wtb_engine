name: WTB News Engine V72 (Think School Human-Edited Edition • Zero-Recursion Crash Fix) (Zero-Apt-Timeout Instant Boot • 25s Channel Cleaner • Auto Google Search Console Verify)

on:
  workflow_dispatch:
    inputs:
      force_mega_news:
        description: 'Force 9-10 Min 24h Global News Mega Video (true/false)'
        required: false
        default: 'false'
      pairs_per_run:
        description: 'Number of Long+Short video pairs per run (1 = 1 Long + 1 Short every 2 hours)'
        required: false
        default: '1'
      bypass_cooldown:
        description: 'Run immediately even if last upload was < 2 hours ago (true/false)'
        required: false
        default: 'true'
  push:
    branches:
      - main
    paths:
      - 'wtb_engine.py'
      - '.github/workflows/**'
  schedule:
    - cron: '*/10 * * * *'
    - cron: '7 * * * *'
    - cron: '22 * * * *'
    - cron: '37 * * * *'
    - cron: '52 * * * *'

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: wtb-production-group
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: '1'

jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 95

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instant 5s Google Search Console & GitHub Pages Live Publisher (docs/)
        run: |
          rm -f workflow_schedule_state.json .github/scripts/claim_schedule_slot.py temp/channel_cap_hit.flag || true
          mkdir -p docs/articles
          touch docs/.nojekyll
          printf 'google-site-verification: google6c68a020be85b251.html' > docs/google6c68a020be85b251.html
          if [ ! -f docs/index.html ]; then
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google-site-verification" content="google6c68a020be85b251"><title>World Talk Brief (@WorldTalkBrief) • Global Investigative Documentaries</title><meta name="description" content="Official investigative documentary and case-study portal of World Talk Brief (@WorldTalkBrief)."><link rel="canonical" href="https://bapuop17.github.io/wtb_engine/"></head><body style="background:#070c17;color:#eaf1ff;font-family:sans-serif;text-align:center;padding:40px;"><h1>WORLD TALK BRIEF (@WorldTalkBrief)</h1><p>Global Geopolitics, Macro-Economics, AI and Investigative Case Studies</p><p><a href="https://www.youtube.com/@WorldTalkBrief?sub_confirmation=1" style="background:#ff2a4b;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:bold;">Subscribe on YouTube (@WorldTalkBrief)</a></p></body></html>' > docs/index.html
          fi
          if [ ! -f docs/sitemap.xml ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://bapuop17.github.io/wtb_engine/index.html</loc><changefreq>hourly</changefreq><priority>1.0</priority></url></urlset>' > docs/sitemap.xml
          fi
          if [ ! -f docs/video-sitemap.xml ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:video="http://www.google.com/schemas/sitemap-video/1.1"><url><loc>https://bapuop17.github.io/wtb_engine/index.html</loc></url></urlset>' > docs/video-sitemap.xml
          fi
          git config user.name "WorldTalkBrief-Bot"
          git config user.email "bot@worldtalkbrief.org"
          git add docs/ || true
          if ! git diff --staged --quiet; then
            git commit -m "Deploy Google Search Console verification & GitHub Pages portal [V71]" || true
            git pull --rebase -X theirs origin main || true
            git push origin HEAD:main || true
          fi

      - name: Smart 2-Hour Algorithm Cooldown Gate (Fast 3s Check on Cron Runs)
        id: cooldown_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BYPASS_COOLDOWN: ${{ github.event.inputs.bypass_cooldown || 'true' }}
        run: |
          python3 - << 'EOF'
          import json, os, time, subprocess
          from datetime import datetime, timezone

          event_name = os.environ.get("EVENT_NAME", "schedule")
          bypass = os.environ.get("BYPASS_COOLDOWN", "true").lower() == "true"
          cooldown_mins = 115

          if event_name == "schedule":
              try:
                  subprocess.run(["git", "fetch", "origin", "main"], timeout=15, check=False)
                  subprocess.run(["git", "reset", "--hard", "origin/main"], timeout=10, check=False)
              except Exception:
                  pass

          if event_name in ("workflow_dispatch", "push") and bypass:
              print(f"🚀 [{event_name.upper()} TRIGGER] Bypassing 2-hour cooldown — starting V71 build immediately!")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("should_run=true\n")
              raise SystemExit(0)

          last_epoch = 0
          if os.path.exists("published_history.json"):
              try:
                  with open("published_history.json", "r", encoding="utf-8") as f:
                      h = json.load(f)
                  if h.get("last_upload_epoch"):
                      last_epoch = int(h["last_upload_epoch"])
                  elif h.get("updated_at"):
                      dt_str = str(h["updated_at"]).replace("Z", "")
                      dt = datetime.fromisoformat(dt_str).replace(tzinfo=timezone.utc)
                      last_epoch = int(dt.timestamp())
              except Exception:
                  pass

          if last_epoch <= 0:
              try:
                  git_ts = subprocess.check_output(["git", "log", "-1", "--format=%ct", "--", "published_history.json"], text=True).strip()
                  if git_ts.isdigit():
                      last_epoch = int(git_ts)
              except Exception:
                  pass

          now_epoch = int(time.time())
          elapsed_mins = (now_epoch - last_epoch) / 60.0 if last_epoch > 0 else 999.0

          if elapsed_mins >= cooldown_mins:
              print(f"✅ [2-Hour Cooldown Complete] {elapsed_mins:.1f} mins elapsed since last upload (>= {cooldown_mins}m). Launching V71 build!")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("should_run=true\n")
          else:
              rem_m = cooldown_mins - elapsed_mins
              print(f"⏳ [2-Hour Cooldown Active] Only {elapsed_mins:.1f} mins since last upload ({rem_m:.1f}m remaining). Running fast 25s Channel Cleaner instead!")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("should_run=false\n")
          EOF

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fast 25s Channel Spam-Backlog Cleaner (Runs During Cooldown Ticks!)
        if: steps.cooldown_gate.outputs.should_run == 'false'
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          YOUTUBE_TOKEN_JSON_B64_2: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_2 }}
          YOUTUBE_TOKEN_JSON_B64_3: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_3 }}
          YOUTUBE_TOKEN_JSON_B64_4: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_4 }}
        run: |
          pip install --quiet google-api-python-client google-auth-oauthlib google-auth-httplib2 requests feedparser beautifulsoup4 pillow numpy opencv-python-headless
          python3 -u wtb_engine.py --rehab-only || true

      - name: Verify Pre-Installed FFmpeg & Fonts (Zero Azure Apt Hang!)
        if: steps.cooldown_gate.outputs.should_run == 'true'
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "✅ FFmpeg & Ubuntu system fonts already pre-installed on runner — skipping slow apt-get!"
          else
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            timeout 60s sudo apt-get update -y || true
            timeout 90s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation || true
          fi

      - name: Install Python V71 Documentary & Motion-Graphics Libraries (Fast Binary Wheels)
        if: steps.cooldown_gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade             edge-tts             gTTS             feedparser             requests             pillow             "moviepy<2.0"             imageio-ffmpeg             numpy             scipy             matplotlib             beautifulsoup4             lxml             opencv-python-headless             ddgs             yt-dlp             googlenewsdecoder             trafilatura             youtube-transcript-api             google-api-python-client             google-auth-oauthlib             google-auth-httplib2

      - name: Run WTB V71 Documentary News Engine (1 Long + 1 Short Pair Every 2 Hours)
        if: steps.cooldown_gate.outputs.should_run == 'true'
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          YOUTUBE_TOKEN_JSON_B64_2: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_2 }}
          YOUTUBE_TOKEN_JSON_B64_3: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_3 }}
          YOUTUBE_TOKEN_JSON_B64_4: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_MEGA_NEWS: ${{ github.event.inputs.force_mega_news || 'false' }}
          PAIRS_PER_RUN: ${{ github.event.inputs.pairs_per_run || '1' }}
        run: |
          python3 -u wtb_engine.py

      - name: Save Non-Repeating Topic, SEO Portal & Rehab History to GitHub (Triggers GitHub Pages Deploy!)
        if: always()
        shell: bash
        run: |
          git config user.name "WorldTalkBrief-Bot"
          git config user.email "bot@worldtalkbrief.org"
          git checkout -- .github/workflows/ || true
          git rm -f --ignore-unmatch workflow_schedule_state.json .github/scripts/claim_schedule_slot.py || true
          mkdir -p docs/articles
          touch docs/.nojekyll
          printf 'google-site-verification: google6c68a020be85b251.html' > docs/google6c68a020be85b251.html
          test -f published_history.json && git add published_history.json || true
          test -f data/published_history.json && git add data/published_history.json || true
          test -d docs && git add docs/ || true
          git diff --staged --quiet || git commit -m "Auto-sync history & SEO Video Portal docs/ [V71]"
          git pull --rebase -X theirs origin main || true
          git push origin HEAD:main || (sleep 3 && git pull --rebase -X theirs origin main && git push origin HEAD:main) || true
          curl -sS "https://api.indexnow.org/indexnow?url=https://${GITHUB_REPOSITORY%/*}.github.io/${GITHUB_REPOSITORY#*/}/sitemap.xml&key=wtb757dd23b1dd97218indexnow2026" >/dev/null 2>&1 || true
          curl -sS -X POST "https://pubsubhubbub.appspot.com/" -d "hub.mode=publish&hub.url=https://${GITHUB_REPOSITORY%/*}.github.io/${GITHUB_REPOSITORY#*/}/rss.xml" >/dev/null 2>&1 || true

      - name: Upload Generated 1080p Videos, Thumbnails & QC Reports to GitHub Artifacts
        if: steps.cooldown_gate.outputs.should_run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: World-Talk-Brief-1080p-Output-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Keep Workflow Active for Next Cron Heartbeat
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable "test_and_run.yml" || true

name: World Talk Brief 1080p Cloud Engine (Test + 24x7 Auto)

on:
  workflow_dispatch:
  schedule:
    # Runs 24/7 across all global timezones (Every 3 hours = 8 runs/day -> 16 Videos/Day with backup tokens!)
    - cron: '0 0,3,6,9,12,15,18,21 * * *'

permissions:
  contents: write

jobs:
  build-1080p-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install edge-tts gTTS feedparser requests pillow "moviepy<2.0" numpy beautifulsoup4 opencv-python-headless google-api-python-client google-auth-oauthlib

      - name: Run World Talk Brief 1080p Broadcast Engine & Auto-Upload to YouTube
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          YOUTUBE_TOKEN_2_B64: ${{ secrets.YOUTUBE_TOKEN_2_B64 }}
          YOUTUBE_TOKEN_3_B64: ${{ secrets.YOUTUBE_TOKEN_3_B64 }}
        run: |
          python3 -u wtb_engine.py

      - name: Save Non-Repeating Topic & Source History to GitHub
        run: |
          if [ -f published_history.json ]; then
            git config user.name "WorldTalkBrief-Bot"
            git config user.email "bot@worldtalkbrief.org"
            git add published_history.json
            git diff --staged --quiet || git commit -m "Update published_history.json [skip ci]"
            git push
          fi

      - name: Upload Generated 1080p Videos & Thumbnail to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: World-Talk-Brief-1080p-Output
          path: |
            output/WTB_1080p_Short_9x16.mp4
            output/WTB_1080p_Long_16x9.mp4
            output/WTB_1080p_Thumb_1.jpg
            output/WTB_1080p_Short_Thumb.jpg
            output/wtb_1080p_report.json
          retention-days: 7

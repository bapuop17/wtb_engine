name: WTB News Engine V39 (24x7 Smart-Paced Auto-Upload • Point-to-Point HD Visuals • Global Countries + Stock Markets)

on:
  workflow_dispatch:
    inputs:
      force_mega_news:
        description: 'Force 9-10 Min 24h Global News Mega Video (true/false)'
        required: false
        default: 'false'
      pairs_per_run:
        description: 'Number of Long+Short video pairs per run (1 = 1 Long + 1 Short = 2 Videos every ~1.5-2h = 20-24 Videos/Day)'
        required: false
        default: '1'
  push:
    branches:
      - main
    paths:
      - 'wtb_engine.py'
      - '.github/workflows/**'
  schedule:
    # Staggered Cron Triggers + Smart-Paced Self-Chaining Auto-Trigger below = 20-24 Videos Smoothly Spread Across 24 Hours!
    - cron: '12 */2 * * *'
    - cron: '42 1,5,9,13,17,21 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: wtb-production-group
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: '1'

jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Remove Broken Schedule Blocker Files (Self-Healing Cleanup)
        run: |
          rm -f workflow_schedule_state.json .github/scripts/claim_schedule_slot.py || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Multimedia, Cairo & Font Dependencies (Fast IPv4)
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" update -y || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-freefont-ttf \
            fonts-noto-core

      - name: Install Python V39 Documentary & Motion-Graphics Libraries
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade \
            edge-tts \
            gTTS \
            feedparser \
            requests \
            pillow \
            "moviepy<2.0" \
            numpy \
            scipy \
            matplotlib \
            pycairo \
            beautifulsoup4 \
            lxml \
            opencv-python-headless \
            ddgs \
            yt-dlp \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Run WTB V39 Documentary News Engine
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          YOUTUBE_TOKEN_JSON_B64_2: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_2 }}
          YOUTUBE_TOKEN_JSON_B64_3: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_3 }}
          YOUTUBE_TOKEN_JSON_B64_4: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_MEGA_NEWS: ${{ github.event.inputs.force_mega_news || 'false' }}
          PAIRS_PER_RUN: ${{ github.event.inputs.pairs_per_run || '1' }}
        run: |
          python3 -u wtb_engine.py

      - name: Save Non-Repeating Topic & Country History to GitHub
        if: always()
        shell: bash
        run: |
          git config user.name "WorldTalkBrief-Bot"
          git config user.email "bot@worldtalkbrief.org"
          git checkout -- .github/workflows/ || true
          git rm -f --ignore-unmatch workflow_schedule_state.json .github/scripts/claim_schedule_slot.py || true
          test -f published_history.json && git add published_history.json || true
          git diff --staged --quiet || git commit -m "Auto-sync published_history.json [V39]"
          git pull --rebase -X theirs origin main || true
          git push origin HEAD:main || (sleep 3 && git pull --rebase -X theirs origin main && git push origin HEAD:main) || true

      - name: Upload Generated 1080p Videos, Thumbnails & QC Reports to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: World-Talk-Brief-1080p-Output-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Smart-Paced 24x7 Auto-Scheduler (Spaces Uploads Across 24 Hours to Respect YouTube Channel Limit)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable "test_and_run.yml" || true
          echo "⏳ Waiting 60 minutes before auto-triggering next batch so 20-24 daily uploads are smoothly spread across 24 hours..."
          sleep 3600
          gh workflow run "test_and_run.yml" --ref main || true

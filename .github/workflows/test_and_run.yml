name: WTB News Engine V21 (God-Level Documentary Production)

on:
  workflow_dispatch:
    inputs:
      force_mega_news:
        description: 'Force 9-10 Min 24h Global News Mega Video (true/false)'
        required: false
        default: 'false'
  schedule:
    # Runs every 30 minutes across the 24h clock for continuous global coverage
    - cron: '*/30 * * * *'
    # Dedicated 6:00 PM USA Eastern Time (22:00 UTC) 9-10 Min 24-Hour Global News Mega Broadcast
    - cron: '0 22 * * *'

permissions:
  contents: write

concurrency:
  group: wtb-production-group
  cancel-in-progress: false

jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Multimedia, Cairo & Font Dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-freefont-ttf

      - name: Install Python V21 Documentary & Motion-Graphics Libraries
        run: |
          python -m pip install --upgrade pip
          pip install \
            edge-tts \
            gTTS \
            feedparser \
            requests \
            pillow \
            "moviepy<2.0" \
            numpy \
            scipy \
            matplotlib \
            pycairo \
            beautifulsoup4 \
            lxml \
            opencv-python-headless \
            ddgs \
            yt-dlp \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Run WTB V21 Documentary News Engine
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_MEGA_NEWS: ${{ github.event.inputs.force_mega_news || 'false' }}
        run: |
          python3 -u wtb_engine.py

      - name: Save Non-Repeating Topic & Category History to GitHub
        if: always()
        run: |
          if [ -f published_history.json ]; then
            git config user.name "WorldTalkBrief-Bot"
            git config user.email "bot@worldtalkbrief.org"
            git pull --rebase origin main || true
            git add published_history.json
            git diff --staged --quiet || git commit -m "Update published_history.json [skip ci]"
            git push || true
          fi

      - name: Upload Generated 1080p Videos & Thumbnails to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: World-Talk-Brief-1080p-Output-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.jpg
            output/wtb_1080p_report.json
          if-no-files-found: ignore
          retention-days: 3

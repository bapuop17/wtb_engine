name: World Talk Brief 1080p Cloud Engine (Test + 24x7 Auto)

on:
  workflow_dispatch:
  schedule:
    # Runs 5 to 8 times daily across the 24h clock (4 Videos per run = 20+ Videos/Day!)
    - cron: '10 0,3,6,9,12,15,18,21 * * *'
    - cron: '40 1,4,7,10,13,16,19,22 * * *'

permissions:
  contents: write

concurrency:
  group: wtb-production-group
  cancel-in-progress: false

jobs:
  build-1080p-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install edge-tts gTTS feedparser requests pillow "moviepy<2.0" numpy beautifulsoup4 opencv-python-headless google-api-python-client google-auth-oauthlib

      - name: Run World Talk Brief Multi-API AI Factory (Groq + Deepgram Aura + HuggingFace + YouTube API)
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -u wtb_engine.py

      - name: Save Non-Repeating Topic & Category History to GitHub
        run: |
          if [ -f published_history.json ]; then
            git config user.name "WorldTalkBrief-Bot"
            git config user.email "bot@worldtalkbrief.org"
            git pull --rebase origin main || true
            git add published_history.json
            git diff --staged --quiet || git commit -m "Update published_history.json [skip ci]"
            git push || true
          fi

      - name: Upload Generated 1080p Videos & Thumbnails to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: World-Talk-Brief-1080p-Output
          path: |
            output/*.mp4
            output/*.jpg
            output/wtb_1080p_report.json
          retention-days: 3

name: WTB News Engine V59 (15m Unstoppable Cron + 2-Hour Smart Cooldown Gate • 1 Pair/2h • Zero Spam Throttle)

on:
  workflow_dispatch:
    inputs:
      force_mega_news:
        description: 'Force 9-10 Min 24h Global News Mega Video (true/false)'
        required: false
        default: 'false'
      pairs_per_run:
        description: 'Number of Long+Short video pairs per run (1 = 1 Long + 1 Short every 2 hours)'
        required: false
        default: '1'
      bypass_cooldown:
        description: 'Run immediately even if last upload was < 2 hours ago (true/false)'
        required: false
        default: 'true'
  push:
    branches:
      - main
    paths:
      - 'wtb_engine.py'
      - '.github/workflows/**'
  schedule:
    # 4 Staggered Cron Triggers Every Hour (Every 15 Minutes = 96 Triggers/Day!)
    # Guarantees GitHub Actions NEVER stalls for 4-6 hours when individual cron ticks are dropped,
    # while the 3-second Cooldown Gate below ensures videos only build & upload once every 2 hours!
    - cron: '7 * * * *'
    - cron: '22 * * * *'
    - cron: '37 * * * *'
    - cron: '52 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: wtb-production-group
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: '1'

jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 95

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Remove Broken Schedule Blocker Files (Self-Healing Cleanup)
        run: |
          rm -f workflow_schedule_state.json .github/scripts/claim_schedule_slot.py temp/channel_cap_hit.flag || true

      - name: Smart 2-Hour Algorithm Cooldown Gate (Fast 3s Check on Cron Runs)
        id: cooldown_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BYPASS_COOLDOWN: ${{ github.event.inputs.bypass_cooldown || 'true' }}
        run: |
          python3 - << 'EOF'
          import json, os, time, subprocess
          from datetime import datetime, timezone

          event_name = os.environ.get("EVENT_NAME", "schedule")
          bypass = os.environ.get("BYPASS_COOLDOWN", "true").lower() == "true"
          cooldown_mins = 115  # ~2 Hours between uploads

          # Always run immediately on manual button click (`workflow_dispatch`) or code push (`push`)!
          if event_name in ("workflow_dispatch", "push") and bypass:
              print(f"🚀 [{event_name.upper()} TRIGGER] Bypassing 2-hour cooldown — starting build immediately!")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("should_run=true\n")
              raise SystemExit(0)

          last_epoch = 0
          if os.path.exists("published_history.json"):
              try:
                  with open("published_history.json", "r", encoding="utf-8") as f:
                      h = json.load(f)
                  if h.get("last_upload_epoch"):
                      last_epoch = int(h["last_upload_epoch"])
                  elif h.get("updated_at"):
                      dt_str = str(h["updated_at"]).replace("Z", "")
                      dt = datetime.fromisoformat(dt_str).replace(tzinfo=timezone.utc)
                      last_epoch = int(dt.timestamp())
              except Exception:
                  pass

          if last_epoch <= 0:
              try:
                  git_ts = subprocess.check_output(["git", "log", "-1", "--format=%ct", "--", "published_history.json"], text=True).strip()
                  if git_ts.isdigit():
                      last_epoch = int(git_ts)
              except Exception:
                  pass

          now_epoch = int(time.time())
          elapsed_mins = (now_epoch - last_epoch) / 60.0 if last_epoch > 0 else 999.0

          if elapsed_mins >= cooldown_mins:
              print(f"✅ [2-Hour Cooldown Complete] {elapsed_mins:.1f} mins elapsed since last upload (>= {cooldown_mins}m). Launching V59 build!")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("should_run=true\n")
          else:
              rem_m = cooldown_mins - elapsed_mins
              print(f"⏳ [2-Hour Cooldown Active] Only {elapsed_mins:.1f} mins since last upload ({rem_m:.1f}m remaining). Exiting cleanly in 3s so YouTube gives current video full impressions!")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("should_run=false\n")
          EOF

      - name: Set up Python 3.11
        if: steps.cooldown_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Multimedia, Cairo & Font Dependencies (Fast IPv4)
        if: steps.cooldown_gate.outputs.should_run == 'true'
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" update -y || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-freefont-ttf \
            fonts-noto-core

      - name: Install Python V59 Documentary & Motion-Graphics Libraries
        if: steps.cooldown_gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade \
            edge-tts \
            gTTS \
            feedparser \
            requests \
            pillow \
            "moviepy<2.0" \
            numpy \
            scipy \
            matplotlib \
            pycairo \
            beautifulsoup4 \
            lxml \
            opencv-python-headless \
            ddgs \
            yt-dlp \
            googlenewsdecoder \
            trafilatura \
            youtube-transcript-api \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Run WTB V59 Documentary News Engine (1 Long + 1 Short Pair Every 2 Hours)
        if: steps.cooldown_gate.outputs.should_run == 'true'
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          YOUTUBE_TOKEN_JSON_B64_2: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_2 }}
          YOUTUBE_TOKEN_JSON_B64_3: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_3 }}
          YOUTUBE_TOKEN_JSON_B64_4: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_MEGA_NEWS: ${{ github.event.inputs.force_mega_news || 'false' }}
          PAIRS_PER_RUN: ${{ github.event.inputs.pairs_per_run || '1' }}
        run: |
          python3 -u wtb_engine.py

      - name: Save Non-Repeating Topic & Country History to GitHub
        if: steps.cooldown_gate.outputs.should_run == 'true' && always()
        shell: bash
        run: |
          git config user.name "WorldTalkBrief-Bot"
          git config user.email "bot@worldtalkbrief.org"
          git checkout -- .github/workflows/ || true
          git rm -f --ignore-unmatch workflow_schedule_state.json .github/scripts/claim_schedule_slot.py || true
          test -f published_history.json && git add published_history.json || true
          git diff --staged --quiet || git commit -m "Auto-sync published_history.json [V59]"
          git pull --rebase -X theirs origin main || true
          git push origin HEAD:main || (sleep 3 && git pull --rebase -X theirs origin main && git push origin HEAD:main) || true

      - name: Upload Generated 1080p Videos, Thumbnails & QC Reports to GitHub Artifacts
        if: steps.cooldown_gate.outputs.should_run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: World-Talk-Brief-1080p-Output-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Keep Workflow Active for Next 15-Min Cron Heartbeat
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable "test_and_run.yml" || true

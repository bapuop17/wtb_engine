name: WTB News Engine V36 (Every 2h • 4 Videos • 1080p)

on:
  workflow_dispatch:
    inputs:
      force_mega_news:
        description: 'Force 9-10 Min 24h Global News Mega Video (true/false)'
        required: false
        default: 'false'
      pairs_per_run:
        description: 'Number of Long+Short video pairs per run (2 = 2 Long + 2 Linked Shorts = 4 Videos)'
        required: false
        default: '2'
  push:
    branches:
      - main
    paths:
      - 'wtb_engine.py'
      - '.github/workflows/**'
  schedule:
    # One run every 2 hours, offset from the top of the hour; 4 outputs/run = 48 planned/day.
    - cron: '17 */2 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: '1'

jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 110

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Multimedia, Cairo & Font Dependencies (Fast IPv4)
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" update -y || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-freefont-ttf \
            fonts-noto-core

      - name: Install Python V35 Documentary & Motion-Graphics Libraries
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade \
            edge-tts \
            gTTS \
            feedparser \
            requests \
            pillow \
            "moviepy<2.0" \
            numpy \
            scipy \
            matplotlib \
            pycairo \
            beautifulsoup4 \
            lxml \
            opencv-python-headless \
            ddgs \
            pycountry \
            yt-dlp \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Run WTB Documentary News Engine (2 Long + 2 Shorts = 4 Videos)
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          YOUTUBE_TOKEN_JSON_B64_2: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_2 }}
          YOUTUBE_TOKEN_JSON_B64_3: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_3 }}
          YOUTUBE_TOKEN_JSON_B64_4: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_MEGA_NEWS: ${{ github.event.inputs.force_mega_news || 'false' }}
          PAIRS_PER_RUN: ${{ github.event.inputs.pairs_per_run || '2' }}
        run: |
          python3 -u wtb_engine.py

      - name: Save Non-Repeating Topic & Country History to GitHub
        if: always()
        shell: bash
        run: |
          test -f published_history.json || exit 0
          git config user.name "WorldTalkBrief-Bot"
          git config user.email "bot@worldtalkbrief.org"
          git checkout -- .github/workflows/ || true
          git add published_history.json
          git diff --staged --quiet || git commit -m "Auto-sync published_history.json"
          git pull --rebase -X theirs origin main || true
          git push origin HEAD:main || (sleep 3 && git pull --rebase -X theirs origin main && git push origin HEAD:main) || true

      - name: Ensure Workflow Schedule stays Active on GitHub
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable "test_and_run.yml" || true

      - name: Upload Generated 1080p Videos, Thumbnails & QC Reports to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: World-Talk-Brief-1080p-Output-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
          if-no-files-found: ignore
          retention-days: 3

name: WTB News Engine V24 (Nitish Rajput + Think School + Abhi & Niyu Documentary Production)

on:
  workflow_dispatch:
    inputs:
      force_mega_news:
        description: 'Force 9-10 Min 24h Global News Mega Video (true/false)'
        required: false
        default: 'false'
      pairs_per_run:
        description: 'Number of Long+Short video pairs per run (2 = 2 Long + 2 Linked Shorts = 4 Videos)'
        required: false
        default: '2'
  schedule:
    # Runs every 30 minutes across the 24h clock (2 Long + 2 Linked Shorts = 4 Videos per run!)
    - cron: '*/30 * * * *'
    # Dedicated 6:00 PM USA Eastern Time (22:00 UTC) 9-10 Min 24-Hour Global News Mega Broadcast
    - cron: '0 22 * * *'

permissions:
  contents: write

concurrency:
  group: wtb-production-group
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Multimedia, Headless Blender 3D, Cairo & Font Dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" install -y --no-install-recommends \
            ffmpeg \
            blender \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-freefont-ttf

      - name: Install Python V24 Documentary & Motion-Graphics Libraries
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade \
            edge-tts \
            gTTS \
            feedparser \
            requests \
            pillow \
            "moviepy<2.0" \
            numpy \
            scipy \
            matplotlib \
            pycairo \
            beautifulsoup4 \
            lxml \
            opencv-python-headless \
            ddgs \
            yt-dlp \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Run WTB V24 Documentary News Engine
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_MEGA_NEWS: ${{ github.event.inputs.force_mega_news || 'false' }}
          PAIRS_PER_RUN: ${{ github.event.inputs.pairs_per_run || '2' }}
        run: |
          python3 -u wtb_engine.py

      - name: Save Non-Repeating Topic & Category History to GitHub
        if: always()
        run: |
          if [ -f published_history.json ]; then
            git config user.name "WorldTalkBrief-Bot"
            git config user.email "bot@worldtalkbrief.org"
            git checkout -- .github/workflows/ || true
            git add published_history.json
            if ! git diff --staged --quiet; then
              git commit -m "Auto-sync published_history.json"
            fi
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main || true
              if git push origin HEAD:main; then
                echo "Successfully synced published_history.json on attempt $attempt"
                break
              fi
              sleep 3
            done
          fi

      - name: Upload Generated 1080p Videos, Thumbnails & QC Reports to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: World-Talk-Brief-1080p-Output-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
          if-no-files-found: ignore
          retention-days: 3

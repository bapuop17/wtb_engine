name: WTB News Engine V46 (24x7 Every-15m Cron + Auto-Chaining • 2 Pairs/Run • 10 Trending + 5 Underrated + 5 Categories)

on:
  workflow_dispatch:
    inputs:
      force_mega_news:
        description: 'Force 9-10 Min 24h Global News Mega Video (true/false)'
        required: false
        default: 'false'
      pairs_per_run:
        description: 'Number of Long+Short video pairs per run (2 = 2 Long + 2 Short = 4 Videos per run)'
        required: false
        default: '2'
  push:
    branches:
      - main
    paths:
      - 'wtb_engine.py'
      - '.github/workflows/**'
  schedule:
    # 4 Staggered Cron Triggers Every Hour (Every 15 Minutes = 96 Triggers/Day!) so GitHub peak-hour cron drops NEVER stall for hours!
    - cron: '7 * * * *'
    - cron: '22 * * * *'
    - cron: '37 * * * *'
    - cron: '52 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: wtb-production-group
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: '1'

jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Remove Broken Schedule Blocker Files (Self-Healing Cleanup)
        run: |
          rm -f workflow_schedule_state.json .github/scripts/claim_schedule_slot.py temp/channel_cap_hit.flag || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Multimedia, Cairo & Font Dependencies (Fast IPv4)
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" update -y || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-freefont-ttf \
            fonts-noto-core

      - name: Install Python V46 Documentary & Motion-Graphics Libraries
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade \
            edge-tts \
            gTTS \
            feedparser \
            requests \
            pillow \
            "moviepy<2.0" \
            numpy \
            scipy \
            matplotlib \
            pycairo \
            beautifulsoup4 \
            lxml \
            opencv-python-headless \
            ddgs \
            yt-dlp \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Run WTB V46 Documentary News Engine (2 Long + 2 Short Videos Per Run)
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          YOUTUBE_TOKEN_JSON_B64_2: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_2 }}
          YOUTUBE_TOKEN_JSON_B64_3: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_3 }}
          YOUTUBE_TOKEN_JSON_B64_4: ${{ secrets.YOUTUBE_TOKEN_JSON_B64_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_MEGA_NEWS: ${{ github.event.inputs.force_mega_news || 'false' }}
          PAIRS_PER_RUN: ${{ github.event.inputs.pairs_per_run || '2' }}
        run: |
          python3 -u wtb_engine.py

      - name: Save Non-Repeating Topic & Country History to GitHub
        if: always()
        shell: bash
        run: |
          git config user.name "WorldTalkBrief-Bot"
          git config user.email "bot@worldtalkbrief.org"
          git checkout -- .github/workflows/ || true
          git rm -f --ignore-unmatch workflow_schedule_state.json .github/scripts/claim_schedule_slot.py || true
          test -f published_history.json && git add published_history.json || true
          git diff --staged --quiet || git commit -m "Auto-sync published_history.json [V46]"
          git pull --rebase -X theirs origin main || true
          git push origin HEAD:main || (sleep 3 && git pull --rebase -X theirs origin main && git push origin HEAD:main) || true

      - name: Upload Generated 1080p Videos, Thumbnails & QC Reports to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: World-Talk-Brief-1080p-Output-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Active 24x7 Auto-Chaining Trigger (Prevents GitHub Cron Stalls!)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable "test_and_run.yml" || true
          if [ ! -f temp/channel_cap_hit.flag ]; then
            echo "🚀 Upload succeeded! Auto-triggering next batch in the 20-Slot Lineup..."
            sleep 15
            gh workflow run "test_and_run.yml" --ref main || true
          else
            echo "⏸️ Channel 24h cap currently full; next 15-min cron trigger will auto-resume when rolling 24h slot opens."
          fi
